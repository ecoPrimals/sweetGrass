# SweetGrass Dependency Audit Configuration
# cargo-deny configuration for primal sovereignty

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # bincode 1.3.3 marked "unmaintained" (RUSTSEC-2025-0141) but advisory
    # states it is considered complete. Pulled transitively by tarpc via
    # tokio-serde. No security issue — team chose to stop development.
    "RUSTSEC-2025-0141",
]

[licenses]
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

# Deny gRPC/protobuf dependencies - Primal Sovereignty
deny = [
    # gRPC and protobuf - FORBIDDEN (C++ toolchain, vendor lock-in)
    { name = "tonic", wrappers = [] },
    { name = "prost", wrappers = [] },
    { name = "prost-types", wrappers = [] },
    { name = "protobuf", wrappers = [] },
    { name = "grpcio", wrappers = [] },
    { name = "tonic-build", wrappers = [] },
    { name = "prost-build", wrappers = [] },
    { name = "quick-protobuf", wrappers = [] },
    { name = "pbjson", wrappers = [] },
    
    # C-backend TLS/crypto - Tower Atomic replaces these (Songbird + BearDog)
    { name = "openssl", wrappers = [], use-instead = "Tower Atomic (Songbird + BearDog)" },
    { name = "openssl-sys", wrappers = [], use-instead = "Tower Atomic (Songbird + BearDog)" },
    { name = "native-tls", wrappers = [], use-instead = "Tower Atomic (Songbird + BearDog)" },
    { name = "aws-lc-sys", wrappers = [], reason = "C/ASM crypto backend — Tower Atomic replaces this" },
    { name = "aws-lc-rs", wrappers = [], reason = "C/ASM crypto backend — Tower Atomic replaces this" },
    { name = "ring", wrappers = [], reason = "C/ASM crypto backend — Tower Atomic replaces this" },
    { name = "rustls", wrappers = [], reason = "depends on ring (C/ASM) — Tower Atomic replaces this" },
    
    # Outbound HTTP clients - route through neuralAPI → Songbird instead
    { name = "reqwest", wrappers = [], use-instead = "neuralAPI capability.call(\"http.request\", ...)" },
    { name = "ureq", wrappers = [], use-instead = "neuralAPI capability.call(\"http.request\", ...)" },
    
    # Shared cross-primal types — sovereignty violation (each primal owns its own types)
    { name = "provenance-trio-types", wrappers = [], reason = "Boundary violation — primals communicate via JSON-RPC, not shared crates" },

    # SQL databases — sweetGrass is pure Rust (redb only); no external DB dependencies
    { name = "sqlx", wrappers = [], reason = "Pure Rust dogma — redb is the sole persistent backend" },
    { name = "sqlx-core", wrappers = [], reason = "Pure Rust dogma — no SQL" },
    { name = "sqlx-postgres", wrappers = [], reason = "Pure Rust dogma — no SQL" },
    { name = "sqlx-sqlite", wrappers = [], reason = "Pure Rust dogma — no SQL" },
    { name = "sqlx-mysql", wrappers = [], reason = "Pure Rust dogma — no SQL" },
    { name = "libsqlite3-sys", wrappers = [], reason = "C library — pure Rust only" },
]

skip = []
skip-tree = [
    # Dev-only: criterion benchmarks pull in older rand/getrandom chains
    { name = "criterion" },
    # Dev-only: proptest pulls in rand 0.8 / rand_chacha 0.3 chains
    { name = "proptest" },
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
